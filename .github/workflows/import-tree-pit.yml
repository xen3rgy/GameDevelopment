name: Import optimized tree pit asset

on:
  push:
    branches:
      - zero-rise-v0.7.2
    paths:
      - .github/workflows/import-tree-pit.yml

permissions:
  contents: write

jobs:
  import-tree-pit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zero-rise-v0.7.2
      - name: Download optimized tree pit GLB
        run: |
          mkdir -p dist/assets
          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JUlopLDYyN5bGJonv2ZuqiQVa4/43fb82e3-5669-4283-91ff-a39ba1d37649.glb' \
            -o dist/assets/lindenstadt-tree-pit.glb
          test "$(stat -c%s dist/assets/lindenstadt-tree-pit.glb)" -gt 1500000
          test "$(stat -c%s dist/assets/lindenstadt-tree-pit.glb)" -lt 2200000
      - name: Commit tree pit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/lindenstadt-tree-pit.glb
          git commit -m "Add optimized tree pit GLB asset"
          git push origin HEAD:zero-rise-v0.7.2
