name: ZERO RISE CI

on:
  push:
    branches:
      - zero-rise-v0.7.2
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks and automated tests
        run: npm run ci
      - name: Static server smoke test
        shell: bash
        run: |
          python3 -m http.server 8000 --directory dist >/tmp/zero-rise-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          for path in / /startup.js /app.js /model.js /vendor/three.module.js /assets/civic-limestone-069.png /assets/lindenstadt-mural.png /assets/station-brick-069.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8000$path" -o /dev/null
          done
