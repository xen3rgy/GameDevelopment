name: Import Lindenstadt tree asset

on:
  push:
    branches:
      - zero-rise-v0.7.2
    paths:
      - .github/workflows/import-tree.yml

permissions:
  contents: write

jobs:
  import-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zero-rise-v0.7.2
      - name: Download optimized tree asset
        run: |
          mkdir -p dist/assets
          curl --fail --location --retry 3             'https://d2ol7oe51mr4n9.cloudfront.net/user_3JUlopLDYyN5bGJonv2ZuqiQVa4/0399da72-3a3c-4f3a-a3f7-cb698af235cf.glb'             -o dist/assets/lindenstadt-tree.glb
          test "$(stat -c%s dist/assets/lindenstadt-tree.glb)" -gt 2000000
          test "$(stat -c%s dist/assets/lindenstadt-tree.glb)" -lt 2600000
      - name: Commit tree asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/lindenstadt-tree.glb
          git commit -m "Add optimized Lindenstadt tree asset"
          git push origin HEAD:zero-rise-v0.7.2
