<!doctype html><html lang="de"><meta charset="utf-8"><title>ZERO RISE · Map inspection</title>
<style>body{margin:0;background:#17252b;color:#eee;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;z-index:2;background:#14252de8;padding:12px;border-radius:8px}button,select{padding:8px;margin:3px;background:#304852;color:#fff;border:1px solid #8c9c98}output{display:block;margin:4px}</style>
<canvas id="world"></canvas><nav><select aria-label="Prüfstelle" id="place"></select><button id="measure">30 s messen</button><button id="grass">Gras an / aus</button><button id="fleet">Fuhrpark testen</button><button id="bus">Busfahrt testen</button><button id="rail">Bahnfahrt testen</button><button id="geometry">Ankünfte / Parkplätze prüfen</button><button id="reverse">Gegenseite</button><button id="time">Tag / Nacht</button><button id="quality">Qualität hoch / niedrig</button><output id="status">Lädt …</output><output id="metrics"></output><output id="checks"></output></nav>
<script type="module">
import {World} from '/world.js?v=0.8.1';import {GameModel,newGame,validateSave} from '/model.js?v=0.8.1';import {FrameMetrics} from '/performance.js?v=0.8.1';import {TRANSIT_STOPS,PARKING_SPACES} from '/mobility-layout.js?v=0.8.1';import {bookTrip} from '/transit.js?v=0.8.1';import {vehicleBody,overlaps} from '/traffic.js?v=0.8.1';
const points=[['Hafenenergie · Tankstelle',-33,-76,0],['Hafenwerk · Servicebucht',-33,-98,0],['Wiese · Lindenhöfe',-52,-48,1.5],['Wiese · Nahansicht',-50,-45,2.8],['Mobilwerk · Flotte',76,10,0],['Stadtmitte · Bushalt',-34,9,0],['Lichthof · Baum und Möblierung',49,2,Math.PI],['Anlaufstelle · Eingang',-68,-6,0],['Bahnhof · Stufen',-125,17,-1.2],['Viadukt · Platz',-153,23,1.4],['Kreuzung · Schilder',-8,4,.7],['Schilder · Rückseite',-12,-18,Math.PI],['Markt · Fassade',-36,-5,0],['Bank · Eingang',31,6,Math.PI],['Seitengasse · Boden',50,11,-1.2],['Werkstatt · Eingang',-174,40,Math.PI],['Bruchfeld · Start',-508,18,Math.PI],['Altgleis · Unterführung',-433,0,-Math.PI/2],['Westbruch · Kiosk',-296,-11,0]];
points.push(['Bruchfeld · Hofspielplatz',-507,43,Math.PI]);
const model=new GameModel(newGame(true));const metrics=new FrameMetrics();let measuring=0,grass=true;const world=new World(document.querySelector('canvas'),model);let reverse=false;
const select=document.querySelector('select');points.forEach(([name],i)=>select.add(new Option(name,i)));
function go(){const [name,x,z,angle]=points[Number(select.value)];model.s.position={x,z};model.s.minute=600;world.angle=angle+(reverse?Math.PI:0);world.pitch=.22;world.distance=8;world.cameraRig.reset();world.update(0,{},false);document.querySelector('output').textContent=name;}
select.onchange=go;document.querySelector('#reverse').onclick=()=>{reverse=!reverse;go()};document.querySelector('#time').onclick=()=>{model.s.minute=model.s.minute<1200?1320:600};document.querySelector('#quality').onclick=()=>{model.s.settings.quality=model.s.settings.quality==='high'?'low':'high';world.setQuality(model.s.settings.quality)};go();
document.querySelector('#measure').onclick=()=>{metrics.reset();measuring=performance.now()+30000;};document.querySelector('#grass').onclick=()=>{grass=!grass;world.meadow.enabled=grass;};document.querySelector('#fleet').onclick=()=>{model.s.position={x:76,z:12};model.buyVehicle('bike');model.buyVehicle('car');model.buyVehicle('van');select.value='2';go();document.querySelector('#checks').textContent='Fahrzeuge: '+model.s.fleet.length;};
document.querySelector('#bus').onclick=()=>{const from=TRANSIT_STOPS[1];model.s.position={x:from.x,z:from.z};world.angle=.3;world.cameraRig.reset();bookTrip(model,from.id,'busPark');};document.querySelector('#rail').onclick=()=>{const from=TRANSIT_STOPS.find(p=>p.id==='station');model.s.position={x:from.x,z:from.z};world.angle=-1.2;world.cameraRig.reset();bookTrip(model,from.id,'railSouth');};
document.querySelector('#geometry').onclick=()=>{const errors=[];for(const p of TRANSIT_STOPS){if(!world.canWalkExterior(p.x,p.z,.4))errors.push(p.id+' Interaktion');if(!world.canWalkExterior(p.arrival.x,p.arrival.z,.4))errors.push(p.id+' Ankunft');}for(const p of PARKING_SPACES){if(!world.canWalkExterior(p.exit.x,p.exit.z,.4))errors.push(p.id+' Ausstieg');const b=vehicleBody({...p,id:'van'});if(world.colliders.some(c=>overlaps(b,{x:c.x,z:c.z,width:c.w*2,length:c.d*2,angle:0},.08)))errors.push(p.id+' Karosserie');}document.querySelector('#checks').textContent=errors.length?errors.join(' · '):'PASS: '+TRANSIT_STOPS.length+' Haltepunkte + Ankünfte, '+PARKING_SPACES.length+' Stellplätze + Ausstiege frei';};
let qaSheetActive=false,last=performance.now();function frame(now){if(qaSheetActive){last=now;requestAnimationFrame(frame);return;}const start=performance.now(),dt=Math.max(0,Math.min((now-last)/1000,.05)),trip=model.s.transit;model.updateTime(dt);world.update(dt,{},true);world.meadow.root.visible=grass;if(trip&&!model.s.transit){world.cameraRig.reset();document.querySelector('#checks').textContent='Ankunft '+model.s.position.x+','+model.s.position.z+' · Spielstand validierbar: '+!!validateSave(model.s);}if(measuring){metrics.record(now,performance.now()-start,world.renderer.info.render);const m=metrics.summary();document.querySelector('#metrics').textContent=(now<measuring?'Messung läuft · ':'FERTIG · ')+JSON.stringify(m);if(now>=measuring)measuring=0;}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
// Repeatable street-height contact sheets: roads, side streets, landmarks and seams.
const cleanView=document.createElement('button');cleanView.textContent='Ansicht freistellen';cleanView.onclick=()=>{document.querySelector('nav').style.display='none';};document.querySelector('nav').append(cleanView);addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('nav').style.display='';});
const identityTours={
 'West Prüfung Nord':[['Nordwestliche Häuser',-525,-42,0],['Nordgasse und Garagen',-471,-39,Math.PI/2],['Nördlicher Lagerhof',-392,-73,0],['Westbruch Nordzugänge',-299.75,-75,Math.PI/2]],
 'West Prüfung Mitte':[['Neue Einmündung',-480,1,Math.PI],['Ladehofzufahrt frei',-381,-45,0],['Hofgassen-Einmündung',-318,9,Math.PI],['Hauszugänge Westbruch',-299.75,-34,-Math.PI/2]],
 'West Prüfung Süd':[['Spielplatz-Ausgang',-494,49,Math.PI/2],['Hinterer Hofzugang',-514,66,Math.PI],['Südliche Werkstätten',-373,54,Math.PI],['Wohnhöfe Süd',-310,89,Math.PI]],
 'West Platzierung':[['Garagenhof',-470,-13,0],['Lagercontainer',-369,-36,.9],['Hintergasse',-514,-42,0],['Alte Haltestelle',-283,12,-Math.PI*.75]],
 'West Anschlüsse':[['Ladehof-Ende',-381,-63,0],['Gartenweg-Ende',-480,66,Math.PI],['Hofgasse-Ende',-318,61,Math.PI],['Schrottplatz',-414,-31,0]],
 'West Materialausbau':[['Wohnfassade',-534,39,Math.PI],['Garagenstraße',-471,0,-Math.PI/2],['Werkstatthof',-391,11.5,Math.PI],['Gleisdreieck',-386,-48,0]],
 'Bruchfeld Ausbau':[['Hofspielplatz',-507,43,Math.PI],['Wäschehof',-534,39,0],['Hintergasse',-514,-42,0],['Sträucher und Baumabstand',-445,43,Math.PI]],
 'West Fehlerstellen':[['Auto seitlich',-469.4,-19,-Math.PI/2],['Auto Heck',-471,-16.4,Math.PI],['Anlieferung',-364,-41,0],['Kleine Gewerbehöfe',-495,11,Math.PI]],
 'West Details':[['Unter der Brücke',-422,0,-Math.PI/2],['Rückseite der Brücke',-411,0,Math.PI/2],['Wohnhof',-290,23,Math.PI],['Werkstatthof',-391,9,Math.PI]],
 Bruchfeld:[['Neuer Start',-508,18,Math.PI],['Bruchfelder Weg',-508,1,-Math.PI/2],['Schlafplatz',-511,24,Math.PI],['Gärten',-483.3,49,-.8]],
 Altgleis:[['Bahnunterführung',-433,0,-Math.PI/2],['Ladehof',-389,-17,.15],['Gleisdreieck',-379,-59,Math.PI],['Übergang Westbruch',-350,0,-Math.PI/2]],
 Westbruch:[['PFAND & SPAR',-296,-11,0],['Wohnhof',-290,23,Math.PI],['Bus nach Lindenstadt',-276,10,.1],['Anschluss Bahnhof',-231,0,-Math.PI/2]],
 Bahnhof:[['Bahnhofsplatz',-169,-25,.35],['Seitengasse',-207,29,-Math.PI/2],['Unter den Gleisen',-145,25,Math.PI],['Übergang Lindenhöfe',-116,-9,-.6]],
 Innenstadt:[['Caféstraße',64,-6,0],['Apotheken-Ecke',9,-24,-Math.PI/2],['Stadtbank',32,7,Math.PI],['Übergang Ostkontor',119,-65,-Math.PI/2]],
 Lindenhöfe:[['Wohnstraße',-35,8,Math.PI],['Hofseite',-53,32,-Math.PI/2],['Lichthof',55,14,Math.PI],['Übergang Innenstadt',8,9,-.75]],
 Westhafen:[['Logistik',-70,-69,0],['Servicegasse',-92,-90,-Math.PI/2],['Ladehof',-83,-70,0],['Industrieachse',-110,-116,Math.PI]],
 Nordstadt:[['Nordring',-83,-172,Math.PI],['Ahornstraße',-224,-222,-.7],['Sporthof',-55,-186,0],['Ahornhöfe',55,-186,0]],
 Südwerk:[['Werkstraße',35,168,0],['Verladehof',-48,189,Math.PI],['Altes Stellwerk',-155,188,Math.PI],['Werkhof',156,219,.65]],
 Ostkontor:[['Büroallee',287,-73,0],['Kontorplatz',288,-8,0],['Parkhaus',264,117,0],['Übergang Zentrum',134,9,-.7]],
 Techpark:[['Campusallee',263,-172,Math.PI],['Forschungsgasse',247,-216,.4],['Forum der Ideen',355,-192,0],['Übergang Nordstadt',123,-175,-Math.PI/2]],
 Höhenviertel:[['Gartenstraße',270,156,0],['Lindenblick',357,199,Math.PI],['Ufergarten',353,89,Math.PI],['Grüner Stadtrand',420,214,Math.PI/2]]
};
const tourSelect=document.createElement('select');tourSelect.setAttribute('aria-label','Viertelroute');for(const key of Object.keys(identityTours))tourSelect.add(new Option(key,key));document.querySelector('nav').append(tourSelect);
const sheet=document.createElement('div');sheet.style.cssText='position:fixed;inset:0;z-index:5;background:#17252b;display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr';document.body.append(sheet);
const report=[];
const westCheck=document.createElement('button');westCheck.textContent='Westwege prüfen';document.querySelector('nav').append(westCheck);
const allWestCheck=document.createElement('button');allWestCheck.textContent='West Gesamtprüfung';document.querySelector('nav').append(allWestCheck);
allWestCheck.onclick=async()=>{
 const {WEST_BUILDINGS,WEST_PATHS,WEST_ROADS,WEST_SPAWN}=await import('/west-edge-layout.js?v=0.8.1'),{CityNavigation}=await import('/navigation.js?v=0.8.1'),{streetSurface}=await import('/street-layout.js?v=0.8.1');
 const failures=[],old={...model.s.position},walk=(x,z,r=.35)=>world.canWalkExterior(x,z,r)&&(!!streetSurface(x,z)||WEST_PATHS.some(p=>Math.abs(x-p.x)<=p.w/2&&Math.abs(z-p.z)<=p.d/2)),nav=new CityNavigation(walk,1,{minX:-550,maxX:-260,minZ:-125,maxZ:125});
 for(const b of WEST_BUILDINGS.filter(b=>b.style!=='shelter')){const p={x:b.x,z:b.z+b.face*(b.d/2+1.1)};if(!walk(p.x,p.z,.35)||nav.find(WEST_SPAWN,p).length<2)failures.push('Hauszugang '+b.id);}
 let drivingSamples=0;for(const r of WEST_ROADS){const axis=r.w>r.d?'x':'z',span=axis==='x'?r.w:r.d;for(const id of ['car','van','sport'])for(const direction of [-1,1])for(let n=-span/2+4;n<=span/2-4;n+=2){const x=r.x+(axis==='x'?n:0),z=r.z+(axis==='z'?n:0);if(x>-260)continue;const angle=axis==='x'?direction*Math.PI/2:direction>0?0:Math.PI;if(!world.canDrive({id,x,z,angle},x,z,angle))failures.push(id+' '+r.name+' '+n);drivingSamples++;}}
 const cameraSamples=[];for(const p of [{x:-511,z:27},{x:-509.5,z:-12},{x:-533,z:42.6},{x:-296,z:-15}]){model.s.position=p;world.cameraRig.reset();for(let n=0;n<32;n++){world.angle=n*Math.PI/16;world.pitch=.22;world.distance=8;world.update(1/30,{},false);cameraSamples.push(world.cameraRig.boom);if(world.cameraRig.boom<2.15)failures.push('Dachkamera '+p.x+','+p.z);}}
 model.s.position=old;document.querySelector('#checks').textContent=JSON.stringify({test:'Gesamtes Westviertel',buildings:WEST_BUILDINGS.length,entrances:WEST_BUILDINGS.length-1,roads:WEST_ROADS.length,drivingSamples,cameraSamples:cameraSamples.length,minCameraBoom:Math.min(...cameraSamples),failures});go();
};
westCheck.onclick=async()=>{
 const {WEST_SPAWN,WEST_LOCATIONS,WEST_BINS,WEST_BOTTLE_SPOTS,WEST_HOMES}=await import('/west-edge-layout.js?v=0.8.1');
 const {segmentClear}=await import('/movement.js?v=0.8.1');const failures=[],old={...model.s.position};
 for(const p of [...WEST_LOCATIONS,...WEST_BINS,...WEST_BOTTLE_SPOTS,...TRANSIT_STOPS.filter(p=>p.id==='busWestbruch'),{id:'station-route',x:-175,z:-31},{id:'city-route',x:-27,z:-4}]){
  if(!world.canWalkExterior(p.x,p.z,.4))failures.push('blocked '+(p.id??p.x));
  const route=world.navigator.find(WEST_SPAWN,p);if(route.length<2||route.some((q,i)=>i&&!segmentClear(route[i-1],q,(x,z,r)=>world.canWalkExterior(x,z,r),.4)))failures.push('route '+(p.id??p.x));
 }
 for(const p of WEST_LOCATIONS){model.s.position={x:p.x,z:p.z};world.update(.1,{},true);if(world.nearest()?.id!==p.id)failures.push('interaction '+p.id+' got '+world.nearest()?.id);}
 for(let x=-532;x<=-202;x+=1)if(!world.canWalkExterior(x,0,1.35))failures.push('road '+x);
 for(const id of ['car','van','sport'])for(const angle of [-Math.PI/2,Math.PI/2])for(let x=-527;x<=-245;x+=2){const vehicle={id,x:x-Math.sign(angle),z:0,angle};if(!world.canDrive(vehicle,x,0,angle))failures.push(id+' passage '+x);}
 const people=world.outerPedestrians.filter(p=>WEST_HOMES.includes(p.life.portals[0])).map(p=>({home:p.life.portals[0].id,count:p.life.people.length,active:p.life.people.filter(q=>q.path.length>1).length}));
 model.s.position=old;document.querySelector('#checks').textContent=JSON.stringify({failures,people});
};
const roughButton=document.createElement('button');roughButton.textContent='Schlafplatz testen';document.querySelector('nav').append(roughButton);
roughButton.onclick=()=>{model.s.position={x:-511,z:24};model.s.needs.energy=15;model.beginLifeAction('roughSleep');world.angle=Math.PI;world.pitch=.15;world.cameraRig.reset();};
const parkedCheck=document.createElement('button');parkedCheck.textContent='West-Auto Kamera prüfen';document.querySelector('nav').append(parkedCheck);
const infrastructureCheck=document.createElement('button');infrastructureCheck.textContent='West Infrastruktur prüfen';document.querySelector('nav').append(infrastructureCheck);
infrastructureCheck.onclick=()=>{const failures=[],old={...model.s.position};
 for(const [a,b] of [[[-534,-7],[-534,-43]],[[-534,-43],[-475,-43]],[[-475,-43],[-475,-7]]]){const len=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let n=0;n<=len*2;n++){const t=n/(len*2),x=a[0]+(b[0]-a[0])*t,z=a[1]+(b[1]-a[1])*t;if(!world.canWalkExterior(x,z,.35))failures.push('Hintergasse '+x+','+z);}}
 let minBoom=8;model.s.position={x:-278,z:13.7};world.cameraRig.reset();for(let n=0;n<48;n++){world.angle=n*Math.PI/24;world.pitch=.22;world.distance=8;world.update(1/30,{},false);minBoom=Math.min(minBoom,world.cameraRig.boom);if(world.cameraRig.boom<2.5)failures.push('Haltestelle: Kamera '+n);}
 model.s.position={x:-278,z:10};world.angle=Math.PI;for(let n=0;n<90;n++)world.update(1/60,{},false);const restored=world.cameraRig.boom;if(restored<7.7)failures.push('Kameraabstand außen');model.s.position=old;document.querySelector('#checks').textContent=JSON.stringify({test:'Hintergasse + Haltestellendach',failures,minBoom,exteriorBoom:restored});go();};
parkedCheck.onclick=()=>{const results=[];world.cameraRig.reset();for(let i=0;i<48;i++){const a=i/48*Math.PI*2,x=-471+Math.sin(a)*3.1,z=-19+Math.cos(a)*3.1;model.s.position={x,z};world.angle=a+Math.PI;world.pitch=.22;world.distance=8;for(let n=0;n<3;n++)world.update(1/30,{},false);results.push({walkable:world.canWalkExterior(x,z,.35),boom:world.cameraRig.boom});}document.querySelector('#checks').textContent=JSON.stringify({test:'West-Auto: Umlauf und Kamera über Karosserie',samples:results.length,blocked:results.filter(r=>!r.walkable).length,minBoom:Math.min(...results.map(r=>r.boom)),firstPerson:results.filter(r=>r.boom<2).length});go();};
async function captureTour(minute){
 qaSheetActive=true;sheet.replaceChildren();sheet.style.display='grid';
 for(const [label,x,z,angle] of identityTours[tourSelect.value]){
  model.s.position={x,z};model.s.minute=minute;world.angle=angle;world.pitch=.22;world.distance=8;world.cameraRig.reset();for(let settle=0;settle<10;settle++)world.update(.1,{},true);
  world.camera.position.copy(world.desiredCamera);world.camera.lookAt(world.player.position.clone().add({x:0,y:1.4,z:0}));world.renderer.render(world.scene,world.camera);
  const card=document.createElement('div');card.style.cssText='position:relative;min-width:0;min-height:0';const image=document.createElement('canvas');image.width=640;image.height=360;image.style.cssText='width:100%;height:100%;object-fit:cover';image.getContext('2d').drawImage(world.renderer.domElement,0,0,640,360);card.append(image);
  const caption=document.createElement('span');caption.style.cssText='position:absolute;bottom:4px;left:8px;padding:3px;background:#14252ddd;font:12px system-ui';caption.textContent=label+' · '+(minute===600?'Tag':'Nacht')+' · '+world.renderer.info.render.calls+' Draws';card.append(caption);sheet.append(card);
  report.push({district:tourSelect.value,label,minute,walkable:world.canWalkExterior(x,z,.35),calls:world.renderer.info.render.calls,triangles:world.renderer.info.render.triangles});
 }
 const back=document.createElement('button');back.textContent='Prüfbogen schließen';back.style.cssText='position:fixed;right:8px;top:8px;z-index:6';back.onclick=()=>{sheet.style.display='none';qaSheetActive=false;back.remove();document.querySelector('#checks').textContent=JSON.stringify(report.slice(-4));go();};document.body.append(back);
}
for(const [label,time] of [['Viertel Tag',600],['Viertel Nacht',1320]]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>captureTour(time);document.querySelector('nav').append(button);}
</script></html>
