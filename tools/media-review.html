<!doctype html><html lang="de"><meta charset="utf-8"><title>Aufnahmen · Sichtprüfung</title><style>body{background:#132127;color:white;font:16px system-ui;margin:16px}#frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{width:100%}button{padding:12px}video{width:100%;max-height:440px}</style><button id="first">Aufnahme 18.09.</button><button id="second">Aufnahme 19.09.</button><p id="status"></p><video controls muted></video><div id="frames"></div><script>
const video=document.querySelector('video'),frames=document.querySelector('#frames');let run=0;
async function inspect(index){const id=++run;frames.replaceChildren();video.src='/__video/'+index;await new Promise(r=>video.onloadedmetadata=r);document.querySelector('#status').textContent='Dauer: '+video.duration.toFixed(1)+' s · Einzelbilder';for(let i=0;i<8&&id===run;i++){video.currentTime=Math.max(.1,video.duration*(i+.5)/8);await new Promise(r=>video.onseeked=r);const c=document.createElement('canvas');c.width=800;c.height=Math.round(800*video.videoHeight/video.videoWidth);const a=c.getContext('2d');a.drawImage(video,0,0,c.width,c.height);a.fillStyle='#10232d';a.fillRect(0,0,130,24);a.fillStyle='white';a.font='16px sans-serif';a.fillText(video.currentTime.toFixed(1)+' s',8,18);frames.append(c)}video.pause()}
document.querySelector('#first').onclick=()=>inspect(0);document.querySelector('#second').onclick=()=>inspect(1);inspect(0);
</script></html>
